# Laboratorio 3 - Integracion de pruebas automatizadas al pipeline
# Compila -> ejecuta pruebas unitarias (Quality Gate) -> genera cobertura -> publica reportes

name: Java CI with Maven

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
    # ---------- Preparacion ----------
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # ---------- Etapa 1: Compilacion ----------
    - name: Build with Maven
      run: mvn -B clean compile --file pom.xml

    # ---------- Etapa 2: Pruebas unitarias (Quality Gate) ----------
    - name: Run tests with Maven
      run: mvn -B test --file pom.xml

    # ---------- Etapa 3: Cobertura de codigo ----------
    - name: Run Code Coverage with Maven
      if: always()
      run: mvn -B verify --file pom.xml

    # ---------- Etapa 4: Resumen de resultados en los registros ----------
    - name: Mostrar resumen de pruebas
      if: always()
      run: |
        echo "===== RESULTADO DE LAS PRUEBAS ====="
        cat target/surefire-reports/*.txt || echo "No se generaron reportes de pruebas"
        {
          echo "## Resultado de las pruebas unitarias"
          echo ""
          echo '```'
          grep -h "Tests run" target/surefire-reports/*.txt || echo "sin resultados"
          echo '```'
          echo ""
          echo "## Cobertura de codigo (JaCoCo)"
          echo ""
          echo "| Clase | Inst. cubiertas | Inst. no cubiertas | % |"
          echo "|-------|-----------------|--------------------|---|"
          tail -n +2 target/site/jacoco/jacoco.csv | awk -F',' \
            '{miss+=$4; cov+=$5; printf "| %s | %d | %d | %.1f%% |\n", $3, $5, $4, ($4+$5>0 ? $5*100/($4+$5) : 0)} \
             END {printf "| **TOTAL** | %d | %d | **%.1f%%** |\n", cov, miss, (miss+cov>0 ? cov*100/(miss+cov) : 0)}'
        } >> $GITHUB_STEP_SUMMARY

    # ---------- Etapa 5: Publicacion de artefactos ----------
    - name: Publicar reporte de pruebas
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-pruebas-surefire
        path: target/surefire-reports/
        if-no-files-found: warn

    - name: Publicar reporte de cobertura
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-cobertura-jacoco
        path: target/site/jacoco/
        if-no-files-found: warn

    # ---------- Etapa 6: Empaquetado (solo si las pruebas pasaron) ----------
    - name: Empaquetar aplicacion
      run: mvn -B package --file pom.xml -DskipTests

    - name: Publicar artefacto JAR
      uses: actions/upload-artifact@v4
      with:
        name: aplicacion-jar
        path: target/*.jar
